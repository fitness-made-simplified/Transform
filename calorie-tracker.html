<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitTrack | Calorie & Diet Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0d1117;
      --card-bg: #161b22;
      --card-border: #30363d;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent-green: #2ea043;
      --accent-green-glow: rgba(46, 160, 67, 0.3);
      --accent-blue: #388bfd;
      --accent-orange: #d97706;
      --accent-purple: #a371f7;
      --accent-red: #f85149;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: rgba(22, 27, 34, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 1.4rem;
      font-weight: 800;
    }

    .brand span {
      color: var(--accent-green);
    }

    .target-badge {
      background: rgba(56, 139, 253, 0.1);
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    main {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      width: 100%;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 900px) {
      .grid-container {
        grid-template-columns: 1fr 1.2fr;
      }
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .summary-grid {
 dual-display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }

    .stat-number {
      font-size: 1.4rem;
      font-weight: 700;
      margin-top: 0.25rem;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .progress-container {
      margin-bottom: 1.5rem;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
      color: var(--text-muted);
    }

    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background-color: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-green), #40d060);
      transition: width 0.4s ease;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    input,
    select {
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: var(--bg-dark);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .input-with-btn {
      display: flex;
      gap: 0.5rem;
    }

    .btn-search {
      background: var(--accent-blue);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 1rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      font-size: 0.85rem;
    }

    .btn-search:hover {
      opacity: 0.9;
    }

    .btn-search:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .macro-inputs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }

    .btn {
      width: 100%;
      padding: 0.85rem;
      background-color: var(--accent-green);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .meal-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-height: 380px;
      overflow-y: auto;
    }

    .meal-item {
      background-color: var(--bg-dark);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .meal-info h4 {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .meal-macros {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .meal-calories {
      font-weight: 700;
      color: var(--accent-green);
      margin-right: 1rem;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: var(--accent-red);
      cursor: pointer;
      font-size: 1.1rem;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 2rem 0;
      font-size: 0.9rem;
    }

    .btn-clear {
      background: transparent;
      border: 1px solid var(--accent-red);
      color: var(--accent-red);
      font-size: 0.75rem;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">⚡ Fit<span>Track</span></div>
    <div class="target-badge" id="targetBadge">Target: 2,000 kcal</div>
  </header>

  <main>
    <div class="grid-container">
      
      <section>
        <div class="card" style="margin-bottom: 1.5rem;">
          <div class="card-title">Daily Goal</div>
          <div class="form-group" style="margin-bottom: 0;">
            <label for="calorieTarget">Set Target Calories (kcal)</label>
            <input type="number" id="calorieTarget" value="2000" min="0">
          </div>
        </div>

        <div class="card">
          <div class="card-title">Log Meal</div>

          <div style="margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--card-border);">
            <label for="presetSelect">⚡ Quick Select Common Foods</label>
            <select id="presetSelect">
              <option value="">-- Choose a Preset Food --</option>
              <option value='{"name":"Paneer Tikka (100g)", "cal":260, "p":18, "c":6, "f":18}'>Paneer Tikka (100g) - 260 kcal</option>
              <option value='{"name":"Chicken Breast (150g)", "cal":240, "p":46, "c":0, "f":5}'>Chicken Breast (150g) - 240 kcal</option>
              <option value='{"name":"Roti / Chapati (1 pc)", "cal":100, "p":3, "c":20, "f":1}'>Roti / Chapati (1 pc) - 100 kcal</option>
              <option value='{"name":"Dal Tadka (1 bowl)", "cal":180, "p":9, "c":24, "f":5}'>Dal Tadka (1 bowl) - 180 kcal</option>
              <option value='{"name":"Boiled Egg (1 large)", "cal":78, "p":6, "c":1, "f":5}'>Boiled Egg (1 large) - 78 kcal</option>
              <option value='{"name":"Curd / Yogurt (100g)", "cal":60, "p":3.5, "c":4, "f":3}'>Curd / Yogurt (100g) - 60 kcal</option>
            </select>
          </div>

          <form id="foodForm">
            <div class="form-group">
              <label for="foodName">Food / Meal Description</label>
              <div class="input-with-btn">
                <input type="text" id="foodName" placeholder="e.g. 2 rotis and 1 bowl dal" required>
                <button type="button" id="searchApiBtn" class="btn-search">🔍 Auto Fetch</button>
              </div>
            </div>

            <div class="form-group">
              <label for="calories">Calories (kcal)</label>
              <input type="number" id="calories" placeholder="0" required min="0">
            </div>

            <div class="macro-inputs form-group">
              <div>
                <label for="protein">Protein (g)</label>
                <input type="number" id="protein" placeholder="0" min="0">
              </div>
              <div>
                <label for="carbs">Carbs (g)</label>
                <input type="number" id="carbs" placeholder="0" min="0">
              </div>
              <div>
                <label for="fats">Fats (g)</label>
                <input type="number" id="fats" placeholder="0" min="0">
              </div>
            </div>

            <button type="submit" class="btn">+ Add Meal</button>
          </form>
        </div>
      </section>

      <section>
        <div class="card">
          <div class="card-title">
            <span>Daily Overview</span>
            <button class="btn-clear" id="clearLogBtn">Clear All</button>
          </div>

          <div class="summary-grid">
            <div class="stat-box">
              <div class="stat-label">Consumed</div>
              <div class="stat-number" id="totalCalories">0</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Remaining</div>
              <div class="stat-number" id="remainingCalories" style="color: var(--accent-green);">2000</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Protein</div>
              <div class="stat-number" id="totalProtein" style="color: var(--accent-blue);">0g</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Carbs / Fat</div>
              <div class="stat-number" id="totalCarbsFat" style="color: var(--accent-orange);">0 / 0g</div>
            </div>
          </div>

          <div class="progress-container">
            <div class="progress-label">
              <span>Progress</span>
              <span id="progressPercentage">0%</span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" id="progressBar"></div>
            </div>
          </div>

          <div class="card-title" style="font-size: 1rem;">Today's Meals</div>
          <ul class="meal-list" id="mealList"></ul>
          <div class="empty-state" id="emptyState">No meals logged for today.</div>
        </div>
      </section>

    </div>
  </main>

  <script>
    // ⚠️ NEVER put a real API key in frontend code.
    // Get a free key from https://calorieninjas.com and paste it below ONLY for personal testing.
    const CALORIE_NINJAS_KEY = 'lrI4W2ag+eUOB6HAPRAFeQ==QS1z6N7rg2FQdxvE';

    let state = {
      targetCalories: 2000,
      meals: []
    };

    // Load saved data
    function loadState() {
      try {
        const saved = localStorage.getItem('fittrack_state');
        if (saved) {
          const parsed = JSON.parse(saved);
          state.targetCalories = parsed.targetCalories || 2000;
          state.meals = parsed.meals || [];
        }
      } catch (e) {
        console.warn('Could not load saved state');
      }
    }

    function saveState() {
      localStorage.setItem('fittrack_state', JSON.stringify(state));
    }

    const foodForm = document.getElementById('foodForm');
    const foodNameInput = document.getElementById('foodName');
    const caloriesInput = document.getElementById('calories');
    const proteinInput = document.getElementById('protein');
    const carbsInput = document.getElementById('carbs');
    const fatsInput = document.getElementById('fats');
    const searchApiBtn = document.getElementById('searchApiBtn');
    const presetSelect = document.getElementById('presetSelect');
    const calorieTargetInput = document.getElementById('calorieTarget');
    const mealList = document.getElementById('mealList');
    const emptyState = document.getElementById('emptyState');

    // API Fetch
    searchApiBtn.addEventListener('click', async () => {
      const query = foodNameInput.value.trim();
      if (!query) {
        alert('Please enter a meal description first.');
        return;
      }
      if (!CALORIE_NINJAS_KEY || CALORIE_NINJAS_KEY === 'YOUR_CALORIENINJAS_API_KEY') {
        alert('Please add your CalorieNinjas API key in the code. Never share the key publicly.');
        return;
      }

      searchApiBtn.textContent = 'Fetching...';
      searchApiBtn.disabled = true;

      try {
        const res = await fetch(`https://api.calorieninjas.com/v1/nutrition?query=${encodeURIComponent(query)}`, {
          headers: { 'X-Api-Key': CALORIE_NINJAS_KEY }
        });

        if (!res.ok) throw new Error('API request failed');

        const data = await res.json();

        if (data.items && data.items.length > 0) {
          let c = 0, p = 0, carbs = 0, f = 0;
          data.items.forEach(item => {
            c += item.calories || 0;
            p += item.protein_g || 0;
            carbs += item.carbohydrates_total_g || 0;
            f += item.fat_total_g || 0;
          });

          caloriesInput.value = Math.round(c);
          proteinInput.value = Math.round(p);
          carbsInput.value = Math.round(carbs);
          fatsInput.value = Math.round(f);
        } else {
          alert('Food item not found. Enter values manually.');
        }
      } catch (err) {
        console.error(err);
        alert('API Error. Check connection or API key.');
      } finally {
        searchApiBtn.textContent = '🔍 Auto Fetch';
        searchApiBtn.disabled = false;
      }
    });

    // Preset select
    presetSelect.addEventListener('change', (e) => {
      if (!e.target.value) return;
      try {
        const data = JSON.parse(e.target.value);
        foodNameInput.value = data.name;
        caloriesInput.value = data.cal;
        proteinInput.value = data.p;
        carbsInput.value = data.c;
        fatsInput.value = data.f;
      } catch (err) {
        console.error('Invalid preset data');
      }
    });

    // Target calories
    calorieTargetInput.addEventListener('input', (e) => {
      const val = parseInt(e.target.value) || 0;
      state.targetCalories = Math.max(0, val);
      document.getElementById('targetBadge').textContent = `Target: ${state.targetCalories.toLocaleString()} kcal`;
      saveState();
      updateUI();
    });

    // Add meal
    foodForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const name = foodNameInput.value.trim();
      if (!name) return;

      state.meals.push({
        id: Date.now(),
        name: name,
        calories: Math.max(0, parseInt(caloriesInput.value) || 0),
        protein: Math.max(0, parseInt(proteinInput.value) || 0),
        carbs: Math.max(0, parseInt(carbsInput.value) || 0),
        fats: Math.max(0, parseInt(fatsInput.value) || 0)
      });

      foodForm.reset();
      presetSelect.value = "";
      saveState();
      updateUI();
    });

    // Delete meal
    function deleteMeal(id) {
      state.meals = state.meals.filter(m => m.id !== id);
      saveState();
      updateUI();
    }

    // Clear all
    document.getElementById('clearLogBtn').addEventListener('click', () => {
      if (state.meals.length && confirm('Clear all meals for today?')) {
        state.meals = [];
        saveState();
        updateUI();
      }
    });

    function updateUI() {
      const totals = state.meals.reduce((acc, m) => ({
        calories: acc.calories + m.calories,
        protein: acc.protein + m.protein,
        carbs: acc.carbs + m.carbs,
        fats: acc.fats + m.fats
      }), { calories: 0, protein: 0, carbs: 0, fats: 0 });

      const remaining = state.targetCalories - totals.calories;
      const pct = state.targetCalories > 0
        ? Math.min(Math.round((totals.calories / state.targetCalories) * 100), 100)
        : 0;

      // Update numbers
      document.getElementById('totalCalories').textContent = totals.calories.toLocaleString();
      document.getElementById('remainingCalories').textContent = remaining.toLocaleString();
      document.getElementById('totalProtein').textContent = `${totals.protein}g`;
      document.getElementById('totalCarbsFat').textContent = `${totals.carbs}g / ${totals.fats}g`;
      document.getElementById('progressPercentage').textContent = `${pct}%`;

      // Remaining color
      const remEl = document.getElementById('remainingCalories');
      remEl.style.color = remaining < 0 ? 'var(--accent-red)' : 'var(--accent-green)';

      // Progress bar
      const bar = document.getElementById('progressBar');
      bar.style.width = `${pct}%`;
      bar.style.background = remaining < 0
        ? 'linear-gradient(90deg, var(--accent-red), #ff6b6b)'
        : 'linear-gradient(90deg, var(--accent-green), #40d060)';

      // Target badge
      document.getElementById('targetBadge').textContent = `Target: ${state.targetCalories.toLocaleString()} kcal`;
      calorieTargetInput.value = state.targetCalories;

      // Meal list
      if (state.meals.length === 0) {
        mealList.innerHTML = '';
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
        mealList.innerHTML = state.meals.map(item => `
          <li class="meal-item">
            <div class="meal-info">
              <h4>${item.name}</h4>
              <div class="meal-macros">P: ${item.protein}g | C: ${item.carbs}g | F: ${item.fats}g</div>
            </div>
            <div>
              <span class="meal-calories">+${item.calories} kcal</span>
              <button class="delete-btn" onclick="deleteMeal(${item.id})">&times;</button>
            </div>
          </li>
        `).join('');
      }
    }

    // Init
    loadState();
    updateUI();
  </script>
</body>
</html>
